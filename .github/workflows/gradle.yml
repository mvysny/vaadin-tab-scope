name: Gradle

on: [push, pull_request]

jobs:
  design-tripwires:
    # Its own job on an image with bash + git: the doc layer is checkable without a JVM, and a
    # doc failure then reads as a doc failure rather than as a build one.
    runs-on: ubuntu-latest
    container: buildpack-deps:scm
    steps:
    - uses: actions/checkout@v6
    - name: Verify the design docs
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        design/verify_design_tripwires.sh

  build:

    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [21]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
    - name: Build with Gradle
      run: ./gradlew clean build '-Pvaadin.productionMode' --no-daemon --no-watch-fs

